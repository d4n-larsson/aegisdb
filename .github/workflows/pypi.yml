name: Publish to PyPI

# Builds and publishes the three Python packages on every `v*` tag:
#
#   aegisdb-mcp  (integrations/claude-code) — the Claude Code integration, so
#                teammates can run it with no clone via `uvx aegisdb-mcp`
#   aegisdb      (clients/python)           — the client SDK, dependency-free
#   aegisdb-langgraph (integrations/langgraph) — the LangGraph store adapter
#
# All three take their version from the tag, so the server binary, the
# integration and the clients always carry the same one. Uses PyPI Trusted
# Publishing (OIDC) — no API token.
#
# One-time setup on PyPI: add a Trusted Publisher for EACH project
# (`aegisdb-mcp`, `aegisdb`, `aegisdb-langgraph`) with owner=d4n-larsson,
# repo=aegisdb, workflow=pypi.yml, environment=pypi. A missing entry fails only
# its own job — the jobs are independent on purpose, so one of them cannot hold
# back a release.
#
# ADDING A PACKAGE — read this before tagging. A name PyPI has never seen needs
# a **pending** publisher, registered *before* the tag is pushed: Trusted
# Publishing can create a release but not a project. Without one the first
# upload fails with
#
#     400 Non-user identities cannot create new projects
#
# and that is the whole message — it never says "register a pending publisher".
# Two forms look alike and only one works:
#
#   pypi.org/manage/project/<name>/settings/publishing/  — owner, repository,
#       workflow, environment. No project-name field, because the project you
#       are inside *is* the project. This is the wrong one for a new package.
#   pypi.org/manage/account/publishing/  — the same four fields plus "PyPI
#       Project Name". Under the ACCOUNT sidebar, because the project does not
#       exist yet. This is the one.
#
# The project name must match the built distribution's metadata
# character-for-character; a typo fails with the identical 400, which reads as
# though the publisher were still missing. A pending publisher does not reserve
# the name — it is claimed on first successful upload.
#
# Recovering after the fact is cheap: nothing is uploaded on that 400, so the
# version stays free. Register the pending publisher, then
# `gh run rerun <run-id> --failed`. (`aegisdb-langgraph` hit exactly this on
# v0.8.0, and the other two packages published normally in the same run.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version from tag (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        working-directory: integrations/claude-code
        # PRETEND_VERSION pins the build to the tag, so the artifact version
        # always matches the release (e.g. v0.3.1 -> 0.3.1).
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/claude-code/dist

  client:
    name: aegisdb (client SDK)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version from tag (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The package sits in a subdirectory and setuptools-scm is pointed at the
      # repo root, so PRETEND_VERSION is what keeps the artifact version tied to
      # the tag rather than to whatever the clone depth makes scm infer.
      - name: Build sdist + wheel
        working-directory: clients/python
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -m pip install --upgrade build
          python -m build

      # The package promises no dependencies. Checked here as well as in CI,
      # because this is the artifact people actually install.
      - name: Assert the built wheel declares no runtime dependencies
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python - <<'EOF'
          import importlib.metadata as md
          reqs = md.distribution("aegisdb").requires or []
          runtime = [r for r in reqs if "extra ==" not in r]
          assert not runtime, f"aegisdb gained a runtime dependency: {runtime}"
          print("no runtime dependencies")
          EOF

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: clients/python/dist

  langgraph:
    name: aegisdb-langgraph (store adapter)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version from tag (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        working-directory: integrations/langgraph
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: integrations/langgraph/dist