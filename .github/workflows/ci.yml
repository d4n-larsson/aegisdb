name: CI

# Builds and tests the C server on every push/PR: the plain build under gcc and
# clang, an AddressSanitizer/UBSan build (unit + wire-protocol contract, incl.
# leak detection), and a ThreadSanitizer run of the contract suite against a
# live server (the concurrency lives in the server, not the unit tests). Also
# runs the Python suites that ship alongside it (the Prometheus exporter and the
# Claude Code integration).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'third_party/**'
      - 'integrations/prometheus-exporter/**'
      - 'integrations/claude-code/**'
      - 'Makefile'
      - 'CMakeLists.txt'
      - '.clang-format'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  # Nightly libFuzzer soak (the `fuzz` job below gates on this / manual dispatch).
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build and run unit + contract tests
        env:
          CC: ${{ matrix.cc }}
        # WERROR=1 keeps the tree warning-clean under -Wall -Wextra on both
        # gcc and clang (the default build leaves -Werror off for downstream).
        run: make check WERROR=1

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin clang-format to the version the tree was formatted with; its output
      # drifts between major versions, so an unpinned tool would fail spuriously.
      - name: Check formatting (clang-format, pinned)
        run: |
          python3 -m venv /tmp/cf
          /tmp/cf/bin/pip install --quiet clang-format==22.1.8
          make format-check CLANG_FORMAT=/tmp/cf/bin/clang-format

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned like clang-format; the .clang-tidy allowlist keeps new checks from
      # a newer tool out, but pin anyway for reproducible gate results.
      - name: Lint (clang-tidy, pinned)
        run: |
          python3 -m venv /tmp/ct
          /tmp/ct/bin/pip install --quiet clang-tidy==22.1.8
          make tidy-check CLANG_TIDY=/tmp/ct/bin/clang-tidy

  asan:
    name: ASan + UBSan (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Sanitize both the unit tests and the live server the contract suite
      # drives. halt_on_error surfaces the first UBSan hit; leaks are fatal.
      - name: Build and test under -fsanitize=address,undefined
        env:
          CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra"
          LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: make check

  tsan:
    name: TSan (contract suite vs live server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The contract suite launches the server binary and drives it over many
      # concurrent connections (see test_concurrency), so a TSan-built server
      # exercises the event loop + locking under real contention. The contract
      # runner sends server output to /dev/null, so route TSan reports to files
      # via log_path and fail if any appear. setarch -R disables ASLR, which
      # TSan requires on recent kernels.
      - name: Build server + run contract suite under ThreadSanitizer
        env:
          CFLAGS: "-O1 -g -fsanitize=thread -fno-omit-frame-pointer -Wall -Wextra"
          LDFLAGS: "-fsanitize=thread"
          TSAN_OPTIONS: "halt_on_error=0:log_path=${{ runner.temp }}/tsan"
        run: |
          setarch "$(uname -m)" -R make integration
          if ls "${{ runner.temp }}"/tsan.* >/dev/null 2>&1; then
            echo "::error::ThreadSanitizer reported data races:"
            cat "${{ runner.temp }}"/tsan.*
            exit 1
          fi
          echo "TSan: no races detected"

  fuzz-regress:
    name: Fuzz corpus replay (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Cheap per-PR gate: replay the seed corpus + any checked-in crashers
      # through the record-decode and wire fuzz targets under ASan/UBSan. No
      # libFuzzer (no input generation), so it is deterministic and fast — its
      # job is to guard against regressing a previously-found crash and to prove
      # the targets themselves build and run clean.
      - name: Build + replay fuzz corpus
        env:
          CFLAGS: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra"
          LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: make fuzz-regress

  fuzz:
    name: libFuzzer soak (nightly)
    runs-on: ubuntu-latest
    # Off the per-PR critical path: only the nightly schedule or a manual run.
    # A newly-discovered crash should never block an unrelated PR — it gets
    # minimized into tests/fuzz/corpus/crashers/, where fuzz-regress then pins
    # it on every subsequent PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      CC: clang
      # -max_total_time is per target; keep the whole job well under an hour.
      FUZZ_SECONDS: '300'
    steps:
      - uses: actions/checkout@v5
      - name: Build libFuzzer targets + seed corpus
        run: |
          make fuzz FUZZ_CC=clang
          make fuzz-corpus   # generate seeds (the corpus is not committed)
      - name: Fuzz record_decode
        run: |
          ./build/fuzz/fuzz_record_decode -max_total_time=$FUZZ_SECONDS \
            -artifact_prefix=crash-record- tests/fuzz/corpus/record
      - name: Fuzz wire
        run: |
          ./build/fuzz/fuzz_wire -max_total_time=$FUZZ_SECONDS \
            -artifact_prefix=crash-wire- tests/fuzz/corpus/wire
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crash-*
          if-no-files-found: ignore

  exporter:
    name: Prometheus exporter (unit + live)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Unit tests are pure/stdlib; the live test launches the server binary
      # (built here) and scrapes /metrics end-to-end. Both are dependency-free.
      - name: Build server (for the live scrape test)
        run: make
      - name: Run exporter tests
        working-directory: integrations/prometheus-exporter
        run: |
          python -m unittest discover -s tests/unit -p 'test_*.py'
          python -m unittest discover -s tests/integration -p 'test_*.py'

  python-client:
    name: Python client SDK (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the package's declared `requires-python = ">=3.9"`. The
      # floor is one minor below aegisdb-mcp's because the client needs nothing
      # newer, and an untested floor is a claim rather than a guarantee.
      matrix:
        python: ['3.9', '3.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # test_live.py exercises every method against a real server and skips
      # itself when the binary is absent — so without this the job would stay
      # green while testing none of the operation surface.
      - name: Build server (the live suite launches it)
        run: make && test -x build/aegisdb
      - name: Run protocol + live tests
        run: make sdk-test
      # The package declares no dependencies, which is a promise worth
      # checking: a stray import would only surface on a fresh install.
      - name: Install from source and import with nothing else present
        working-directory: clients/python
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          cd /tmp && python -c "import aegisdb; print(aegisdb.AegisClient)"

  claude-code:
    name: Claude Code integration (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Both ends of the package's declared `requires-python = ">=3.10"`. The
      # floor was previously an untested claim — the same shape of bug as the
      # unbounded `mcp>=1.0` that broke every fresh install in v0.5.4.
      matrix:
        python: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The contract and integration tests launch the server binary from
      # ../../build and skip themselves when it is absent, so it must exist or
      # two thirds of the suite would quietly not run and the job would still be
      # green. `test -x` pins that assumption to a failure instead.
      - name: Build server (the contract + integration tests launch it)
        run: make && test -x build/aegisdb
      # Stdlib unittest throughout — no pytest, no install, and the MCP SDK is
      # not needed (only server.py imports it, and nothing here imports that).
      - name: Run unit + contract + integration tests
        working-directory: integrations/claude-code
        run: make test